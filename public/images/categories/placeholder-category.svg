<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#F0F0EC"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E4E4DF" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  <!-- chip body -->
  <rect x="348" y="173" width="104" height="104" rx="8" stroke="#C0C0BA" stroke-width="2.5" fill="none"/>
  <!-- top legs -->
  <line x1="370" y1="173" x2="370" y2="157" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="173" x2="390" y2="157" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="410" y1="173" x2="410" y2="157" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="173" x2="430" y2="157" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <!-- bottom legs -->
  <line x1="370" y1="277" x2="370" y2="293" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="277" x2="390" y2="293" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="410" y1="277" x2="410" y2="293" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="277" x2="430" y2="293" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <!-- left legs -->
  <line x1="348" y1="193" x2="332" y2="193" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="348" y1="213" x2="332" y2="213" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="348" y1="237" x2="332" y2="237" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="348" y1="257" x2="332" y2="257" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <!-- right legs -->
  <line x1="452" y1="193" x2="468" y2="193" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="452" y1="213" x2="468" y2="213" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="452" y1="237" x2="468" y2="237" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="452" y1="257" x2="468" y2="257" stroke="#C0C0BA" stroke-width="2" stroke-linecap="round"/>
  <!-- inner die -->
  <rect x="375" y="199" width="50" height="50" rx="3" stroke="#C0C0BA" stroke-width="1.5" fill="none"/>
</svg>
